<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KS > Download Center</title>
  <style>
    :root {
      --bg-main: #09090b;
      --card-bg: rgba(20, 20, 23, 0.6);
      --border-primary: rgba(255, 255, 255, 0.08);
      --text-main: #f4f4f5;
      --text-muted: #71717a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .dashboard-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-primary);
      border-radius: 16px;
      width: 90%;
      max-width: 440px; /* Slightly narrowed for a more balanced layout */
      padding: 40px;
      box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 28px; /* Slightly increased gap for visual breathing room */
    }

    .brand-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-tag {
      font-family: monospace;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .version-badge {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-primary);
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: monospace;
    }

    .content-group h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .content-group p {
      font-size: 0.9rem;
      line-height: 1.5;
      color: var(--text-muted);
    }

    .btn-row {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    /* Target the link directly as the flex child */
    .btn-row a {
      flex: 1;
      text-decoration: none;
    }

    /* Direct styled button link layout */
    .cta-btn {
      width: 100%;
      background: var(--text-main);
      color: var(--bg-main);
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      display: block; /* Ensures total clickability within the container */
    }

    .cta-btn:hover {
      background: #ffffff;
      box-shadow: 0 8px 20px rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>

<div class="dashboard-card">
  <div class="brand-meta">
    <span class="brand-tag">KS.package // Center</span>
    <span class="version-badge">Build V24.01.2014</span>
  </div>

  <div class="content-group">
    <h1>Download your KS package</h1>
    <p>Download the Editor Studio(VibeCraft) via the KS package.</p>
  </div>

  <div class="btn-row">
    <!-- If the ZIP files are in the exact same folder as this HTML file -->
    <a href="VibeCraft/.windows().zip" download>
      <button type="button" class="cta-btn">Windows</button>
    </a>

    <a href="VibeCraft/.macOS().zip" download>
      <button type="button" class="cta-btn">macOS</button>
    </a>
  </div>

</div>

</body>
</html>
